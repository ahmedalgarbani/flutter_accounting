name: flutter_accounting
description: >
  A powerful offline accounting library for Flutter. Supports double-entry
  bookkeeping, chart of accounts, journal entries, and financial reports
  (Trial Balance, Balance Sheet, Income Statement).
version: 0.2.1
repository: https://github.com/ahmedalgarbani/flutter_accounting
issue_tracker: https://github.com/ahmedalgarbani/flutter_accounting/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
