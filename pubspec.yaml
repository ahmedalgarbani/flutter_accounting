name: flutter_accounting
description: >
  Offline double-entry accounting engine for Flutter apps: chart of accounts,
  journal entries, posting and reversal, fiscal periods, account ledgers and
  financial reports (Trial Balance, Balance Sheet, Income Statement).
version: 0.4.0
repository: https://github.com/ahmedalgarbani/flutter_accounting
issue_tracker: https://github.com/ahmedalgarbani/flutter_accounting/issues
topics:
  - accounting
  - finance
  - bookkeeping
  - double-entry
  - offline

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.31.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
